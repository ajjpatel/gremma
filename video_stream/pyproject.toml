[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gremma-video-stream"
version = "0.1.0"
description = "Bounded camera capture and local clip selection for Gremma"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
embedding = ["sentence-transformers[image]>=6.1,<7", "transformers>=5.20.2,<6", "av>=19,<20"]

[project.scripts]
gremma-video = "gremma_video.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
